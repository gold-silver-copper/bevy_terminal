name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Bevy's debug artifacts and concurrent links can exhaust hosted runners.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  generated:
    name: Generated tables
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GHOSTTY_REVISION: b40acce58dcf77df52231c3798ea58e924647c89
    steps:
      - uses: actions/checkout@v4
      - name: Nerd Fonts table matches Ghostty's attributes
        run: |
          curl -sSfL "https://raw.githubusercontent.com/ghostty-org/ghostty/$GHOSTTY_REVISION/src/font/nerd_font_attributes.zig" \
            -o "$RUNNER_TEMP/nerd_font_attributes.zig"
          python3 tools/gen_nerd_font_table.py "$RUNNER_TEMP/nerd_font_attributes.zig" "$GHOSTTY_REVISION" \
            | diff -u crates/bevy_terminal/src/render/batch/nerd_font.rs -

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # A short run of each target catches regressions; longer runs are local.
      - name: Fuzz each target for one minute
        working-directory: fuzz
        run: |
          for target in surface ratatui_backend renderer; do
            cargo fuzz run "$target" -s none -- -max_total_time=60 -len_control=0 -timeout=30 -rss_limit_mb=4096
          done

  metal:
    name: Metal readback
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GPU readback regressions
        timeout-minutes: 15
        run: cargo test --workspace --all-features --test gpu_readback --test export_readiness --locked -- --ignored --test-threads=1

  consumer:
    name: Real bevy_ratatui context
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
        with:
          path: terminal
      - name: Checkout pinned consumer
        uses: actions/checkout@v4
        with:
          repository: gold-silver-copper/bevy_ratatui
          ref: 675e9144f5cfc2c49667e44cace48bef0543dace
          path: bevy_ratatui
      - uses: dtolnay/rust-toolchain@stable
      - name: Install windowed build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            terminal/integration/bevy-ratatui-context
            bevy_ratatui
      - name: Native consumer without windowed features
        run: cargo check --manifest-path ../bevy_ratatui/Cargo.toml --lib --no-default-features --features std,crossterm --locked
      - name: Resource-owned raw terminal integration
        run: cargo test --manifest-path integration/bevy-ratatui-context/Cargo.toml --locked
      - name: Windowed consumer and migration fixture
        run: cargo check --manifest-path integration/bevy-ratatui-context/Cargo.toml --features consumer-windowed --locked

  verify:
    name: Workspace and software Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WGPU_BACKEND: vulkan
      WGPU_FORCE_FALLBACK_ADAPTER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install Linux and software Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools \
            fonts-dejavu-core
          # Restrict Vulkan to Mesa's CPU driver, independent of host devices.
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${drivers[0]}"
          printf 'VK_DRIVER_FILES=%s\n' "${drivers[0]}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          printf 'XDG_RUNTIME_DIR=%s\n' "$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"

      - name: Verify software Vulkan availability
        run: vulkaninfo --summary

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Use the same workspace feature set for each Cargo invocation so the
      # GPU test reuses the libraries built for the regular tests.
      - name: Check all targets
        run: cargo check --workspace --all-features --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace --all-features --lib --tests --locked

      - name: GPU readback regressions
        timeout-minutes: 10
        run: cargo test --workspace --all-features --test gpu_readback --test export_readiness --locked -- --ignored --test-threads=1

      - name: Documentation tests
        run: cargo test --workspace --all-features --doc --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
