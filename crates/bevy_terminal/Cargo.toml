[package]
name = "bevy_terminal"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "A terminal scene model and renderer built on Bevy text, UI, and the render world"
license = "MIT"
repository = "https://github.com/gold-silver-copper/bevy_terminal"
documentation = "https://docs.rs/bevy_terminal"
keywords = ["bevy", "terminal", "tui", "rendering"]
categories = ["game-development", "gui", "rendering"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui", "system_font_discovery"] }

[dev-dependencies]
bevy_image_export = { git = "https://github.com/paulkre/bevy_image_export", tag = "v0.17.0" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
