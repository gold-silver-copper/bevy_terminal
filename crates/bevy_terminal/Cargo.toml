[package]
name = "bevy_terminal"
version = "0.8.1"
edition = "2024"
rust-version = "1.95"
description = "A low-level terminal cell renderer built on Bevy text and the render world"
license = "MIT"
repository = "https://github.com/gold-silver-copper/bevy_terminal"
documentation = "https://docs.rs/bevy_terminal"
keywords = ["bevy", "terminal", "tui", "rendering"]
categories = ["game-development", "gui", "rendering"]
# Ghostty's reference sprite atlases are repository-only test fixtures.
exclude = ["src/render/batch/sprite/testdata"]

[features]
default = ["system_fonts"]
# Discover system fonts so generic families such as `FontSource::Monospace` resolve.
system_fonts = ["bevy/system_font_discovery"]

# Measure CPU snapshot and scene construction time; counters remain available without this.
timings = []

[dependencies]
bitflags = "2"
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_image",
    "bevy_text",
] }

# Font line metrics (ascent, descent, leading) for font-driven cell heights.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Already in the graph through bevy_render; derives `Pod` for GPU instances.
bytemuck = { version = "1.5", features = ["derive"] }

[dev-dependencies]
bevy = { version = "0.20", default-features = false, features = ["2d", "ui", "system_font_discovery"] }
# Host-independent font collections for the glyph placement probe.
fontique = { version = "0.11", default-features = false }
unicode-segmentation = "1.13"
# Decodes Ghostty's reference sprite atlases.
png = "0.18"
unicode-width = "0.2"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
