[package]
name = "bevy_terminal"
version = "0.7.7"
edition = "2024"
rust-version = "1.95"
description = "A low-level terminal cell renderer built on Bevy text and the render world"
license = "MIT"
repository = "https://github.com/gold-silver-copper/bevy_terminal"
documentation = "https://docs.rs/bevy_terminal"
keywords = ["bevy", "terminal", "tui", "rendering"]
categories = ["game-development", "gui", "rendering"]

[features]
default = ["system_fonts"]
# Discover system fonts so generic families such as `FontSource::Monospace` resolve.
system_fonts = ["bevy/system_font_discovery"]

# Measure CPU snapshot and scene construction time; counters remain available without this.
timings = []

[dependencies]
bitflags = "2"
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_image",
    "bevy_text",
] }

# Font line metrics (ascent, descent, leading) for font-driven cell heights.
skrifa = { version = "0.42", default-features = false, features = ["std"] }

[dev-dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d", "ui", "system_font_discovery"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
