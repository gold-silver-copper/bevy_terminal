[package]
name = "bevy_terminal"
version = "0.7.3"
edition = "2024"
rust-version = "1.95"
description = "A terminal scene model and renderer built on Bevy text, UI, and the render world"
license = "MIT"
repository = "https://github.com/gold-silver-copper/bevy_terminal"
documentation = "https://docs.rs/bevy_terminal"
keywords = ["bevy", "terminal", "tui", "rendering"]
categories = ["game-development", "gui", "rendering"]

[features]
default = ["ui", "system_fonts"]
# Present terminals through Bevy UI `ImageNode`s and follow the UI scale.
ui = ["bevy/bevy_ui", "bevy/bevy_ui_render"]
# Present terminals on world-space quads (`TerminalWorldQuad`) through `bevy_pbr`.
3d = ["bevy/bevy_pbr", "bevy/bevy_mesh"]
# Discover system fonts so generic families such as `FontSource::Monospace` resolve.
system_fonts = ["bevy/system_font_discovery"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_text",
    "bevy_window",
] }

# The string type of `FontSource::Family`, re-exported so it needs no extra dependency.
smol_str = "0.2"

[dev-dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d", "3d", "ui", "system_font_discovery"] }
bevy_image_export = { git = "https://github.com/paulkre/bevy_image_export", tag = "v0.17.0" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
