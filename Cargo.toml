[workspace]
members = [".", "crates/bevy_terminal"]
resolver = "3"

[package]
name = "bevy_terminal_ratatui"
version = "0.7.3"
edition = "2024"
rust-version = "1.95"
description = "A Ratatui backend for the bevy_terminal Bevy terminal renderer"
license = "MIT"
repository = "https://github.com/gold-silver-copper/bevy_terminal"
documentation = "https://docs.rs/bevy_terminal_ratatui"
keywords = ["bevy", "ratatui", "terminal", "tui"]
categories = ["game-development", "gui", "rendering"]
exclude = [
    "benchmarks/**",
    "CODEBASE_AUDIT*.md",
    "CODEBASE_IMPLEMENTATION_*",
    "crates/**",
    "integration/**",
    "CLEANUP_PROGRESS.md",
    "*_PROMPT.md",
    "assets/fonts/*",
    "!assets/fonts/jetbrains-mono",
]

[features]
default = ["system_fonts"]
# Discover system fonts (forwards `bevy_terminal/system_fonts`).
system_fonts = ["bevy_terminal/system_fonts"]

# Opt into Ratatui's extended backend trait; leave disabled when coexisting
# with backends that implement only the standard trait (such as soft_ratatui).
scrolling-regions = ["ratatui/scrolling-regions"]

# Measure CPU snapshot and scene construction time; counters remain available without this.
timings = ["bevy_terminal/timings"]

[dependencies]
bevy_terminal = { version = "0.7.3", path = "crates/bevy_terminal", default-features = false }
# Only for the `Component` derive on `RatatuiTerminal`; the version is pinned by `bevy_terminal`.
bevy = { version = "0.19", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["std", "underline-color"] }

[dev-dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets"] }
bevy = { version = "0.19", default-features = false, features = ["2d", "3d", "ui", "system_font_discovery"] }
bevy_image_export = { git = "https://github.com/paulkre/bevy_image_export", tag = "v0.17.0" }
# Okhsv -> sRGB gamut math for the `colors_rgb` example port; upstream Ratatui
# uses the same crate for that example.
palette = "0.7"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
