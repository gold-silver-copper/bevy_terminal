[package]
name = "bevy_grid"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A Ratatui backend rendered with Bevy UI and Bevy text"
license = "MIT"
documentation = "https://docs.rs/bevy_grid"
keywords = ["bevy", "ratatui", "terminal", "tui"]
categories = ["game-development", "gui", "rendering"]
exclude = ["benchmarks/renderer-comparison/**"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui", "system_font_discovery"] }
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets", "scrolling-regions", "std", "underline-color"] }

[dev-dependencies]
bevy_image_export = { git = "https://github.com/paulkre/bevy_image_export", tag = "v0.17.0" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
