[workspace]
members = [".", "crates/bevy_terminal"]
resolver = "3"

[package]
name = "bevy_terminal_ratatui"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "A Ratatui backend for the bevy_terminal Bevy terminal renderer"
license = "MIT"
repository = "https://github.com/gold-silver-copper/bevy_terminal"
documentation = "https://docs.rs/bevy_terminal_ratatui"
keywords = ["bevy", "ratatui", "terminal", "tui"]
categories = ["game-development", "gui", "rendering"]
exclude = [
    "benchmarks/renderer-comparison/**",
    "crates/**",
    "*_PROMPT.md",
    "assets/fonts/*",
    "!assets/fonts/jetbrains-mono",
]

[dependencies]
bevy_terminal = { version = "0.3.0", path = "crates/bevy_terminal" }
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets", "scrolling-regions", "std", "underline-color"] }

[dev-dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui", "system_font_discovery"] }
bevy_image_export = { git = "https://github.com/paulkre/bevy_image_export", tag = "v0.17.0" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
