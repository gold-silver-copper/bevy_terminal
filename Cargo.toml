[workspace]
members = [".", "crates/bevy_terminal"]
resolver = "3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Unfinished and debugging code, which tests should not hold either.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# A silenced lint says why.
allow_attributes_without_reason = "deny"

[package]
name = "bevy_terminal_ratatui"
version = "0.12.0"
edition = "2024"
rust-version = "1.97.1"
description = "A Ratatui backend for the bevy_terminal Bevy terminal renderer"
license = "MIT"
repository = "https://github.com/gold-silver-copper/bevy_terminal"
documentation = "https://docs.rs/bevy_terminal_ratatui"
keywords = ["bevy", "ratatui", "terminal", "tui"]
categories = ["game-development", "gui", "rendering"]
include = ["src/**/*.rs", "/README.md", "/LICENSE"]

[features]
default = ["system_fonts"]
# Discover system fonts (forwards `bevy_terminal/system_fonts`).
system_fonts = ["bevy_terminal/system_fonts"]

# Opt into Ratatui's extended backend trait, whose methods every backend in the
# build must then implement. Enable it whenever anything else enables
# `ratatui/scrolling-regions`; leave it disabled when coexisting with backends
# that implement only the standard trait (such as soft_ratatui).
scrolling-regions = ["ratatui/scrolling-regions"]

# Measure CPU snapshot and scene construction time; counters remain available without this.
timings = ["bevy_terminal/timings"]

[dependencies]
bevy_terminal = { version = "0.12.0", path = "crates/bevy_terminal", default-features = false }
# Only for the `Component` derive on `RatatuiTerminal`; the version is pinned by `bevy_terminal`.
bevy = { version = "0.20", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["std", "underline-color"] }

[dev-dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets"] }
bevy = { version = "0.20", default-features = false, features = ["2d", "3d", "ui", "system_font_discovery"] }
bevy_image_export = "0.18.0"
# Okhsv -> sRGB gamut math for the `colors_rgb` example port; upstream Ratatui
# uses the same crate for that example.
palette = "0.7"

[lints]
workspace = true

# Optimized builds for day-to-day development: no LTO and split codegen,
# with incremental compilation, so rebuilds after an edit take seconds.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
