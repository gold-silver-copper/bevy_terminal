[[adapter]]
id = "ratatui_wgpu"
name = "ratatui-wgpu"
status = "unsupported"
source = "https://github.com/Jesterhearts/ratatui-wgpu"
render_path = "WGPU texture/surface backend"
reason = "ratatui-wgpu 0.5.0 seals RenderSurface and exposes its offscreen HeadlessSurface/build_headless API only under cfg(test). Its public API therefore requires an OS presentation surface, which would violate this suite's windowless protocol. Add an adapter when upstream exposes a public offscreen texture target or Bevy-device constructor."

[[excluded]]
id = "raclettui"
source = "https://github.com/Harzu/raclettui"
reason = "Wayland layer-shell application/renderer rather than a reusable Bevy texture backend; it cannot run without a compositor."

[[excluded]]
id = "ratzilla"
source = "https://github.com/ratatui/ratzilla"
reason = "DOM/canvas/WebGL browser backend rather than a Bevy texture renderer."

[[excluded]]
id = "mousefood"
source = "https://github.com/ratatui/mousefood"
reason = "embedded-graphics terminal backend; no desktop Bevy texture presentation path of its own."
